<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실습자료 · 스마트워크 강의자료</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="practice">
<div class="app-shell">
  <div class="topbar">
    <div class="topbar-inner">
      <a href="index.html" style="text-decoration:none;">
        <div class="brand">
          🌱
          <span>
            <span id="navBrandTitle">스마트워크 강의자료</span>
            <small id="navBrandSub">교육 플랫폼</small>
          </span>
        </div>
      </a>
      <div class="nav-menu">
        <a href="index.html" data-page="home">홈</a>
        <a href="study.html" data-page="study">학습자료</a>
        <a href="practice.html" data-page="practice">실습자료</a>
        <a href="questions.html" data-page="questions">질문·답변</a>
        <a href="feedback.html" data-page="feedback">의견제안</a>
        <a href="notices.html" data-page="notices">공지사항</a>
        <a href="admin.html" data-page="admin" style="opacity:.55;font-size:12px;">관리자</a>
      </div>
    </div>
  </div>

  <div class="container">
    <h1 class="page-title">💻 실습자료</h1>
    <p class="page-desc">위에서 실습자료·실습공유를 선택하세요. 실습공유에는 사진도 올려서 다른 참가자들과 나눠보세요.</p>

    <div class="tabs tabs-primary" id="mainTabBar"></div>
    <div class="tabs" id="tabBar"></div>
    <div class="tabs" id="subTabBar" style="margin-top:-8px;"></div>
    <div id="adminAddWrap"></div>
    <div id="itemList">
      <div class="loading-row"><span class="spinner"></span> 불러오는 중...</div>
    </div>
  </div>

  <footer class="site-footer">
    <div>스마트워크 강의자료 · 교육 종료 후에도 자유롭게 참고자료를 활용하세요.</div>
    <div id="footerContact" style="margin-top:4px;font-size:11px;opacity:.75;"></div>
  </footer>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script>
  var IS_ADMIN = false;
  var ALL_ITEMS = [];
  var TOPICS = [];
  var mainTab = 'materials';
  var activeTab = '';
  var activeSubTab = '';
  var editingId = null;
  var adding = false;
  var SHARE_ROWS = null;

  function load() {
    getIsAdmin().then(function (isAdmin) {
      IS_ADMIN = isAdmin;
      return Promise.all([
        sb.from('실습주제').select('*').order('sort_order', { ascending: true }),
        sb.from('실습자료').select('*').order('sort_order', { ascending: true })
      ]);
    }).then(function (results) {
      var topicsRes = results[0], itemsRes = results[1];
      if (topicsRes.error || itemsRes.error) {
        var err = topicsRes.error || itemsRes.error;
        document.getElementById('itemList').innerHTML = '<div class="empty-state">불러오기 실패: ' + escapeHtml(err.message) + '</div>';
        return;
      }
      TOPICS = topicsRes.data || [];
      ALL_ITEMS = itemsRes.data || [];
      var stillValid = TOPICS.some(function (t) { return t.id === activeTab; });
      if (!stillValid) activeTab = TOPICS.length ? TOPICS[0].id : '';
      renderMainTabs();
      renderActiveTab();
    });
  }

  function renderMainTabs() {
    var bar = document.getElementById('mainTabBar');
    bar.innerHTML =
      '<button class="tab-btn' + (mainTab === 'materials' ? ' active' : '') + '" data-main="materials">💻 실습자료</button>' +
      '<button class="tab-btn' + (mainTab === 'share' ? ' active' : '') + '" data-main="share">🙌 실습공유</button>';
    bar.querySelectorAll('[data-main]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        mainTab = btn.getAttribute('data-main');
        editingId = null;
        adding = false;
        renderMainTabs();
        renderActiveTab();
      });
    });
  }

  function promptNewTopic() {
    var title = window.prompt('새 실습 주제 이름을 입력하세요 (예: 상담일지 입력 도구)');
    if (title == null) return;
    title = title.trim();
    if (!title) return;
    sb.from('실습주제').insert({ title: title, sort_order: TOPICS.length }).select().then(function (r) {
      if (r.error) { showToast('주제 추가 실패: ' + r.error.message); return; }
      showToast('주제가 추가되었습니다.');
      activeTab = (r.data && r.data[0]) ? r.data[0].id : activeTab;
      activeSubTab = '';
      load();
    });
  }

  function renderActiveTab() {
    if (mainTab === 'share') {
      document.getElementById('tabBar').innerHTML = '';
      document.getElementById('subTabBar').innerHTML = '';
      document.getElementById('adminAddWrap').innerHTML = '';
      renderShareTab();
    } else {
      renderTabs();
      renderAddForm();
      renderItems();
    }
  }

  function moveTopic(direction) {
    var idx = TOPICS.findIndex(function (t) { return t.id === activeTab; });
    var swapWith = direction === 'left' ? idx - 1 : idx + 1;
    if (idx < 0 || swapWith < 0 || swapWith >= TOPICS.length) return;
    var reordered = TOPICS.slice();
    var tmp = reordered[idx];
    reordered[idx] = reordered[swapWith];
    reordered[swapWith] = tmp;
    Promise.all(reordered.map(function (t, i) {
      return sb.from('실습주제').update({ sort_order: i }).eq('id', t.id);
    })).then(function (results) {
      var failed = results.filter(function (r) { return r && r.error; })[0];
      if (failed) { showToast('순서 변경 실패: ' + failed.error.message); return; }
      load();
    });
  }

  function deleteActiveTopic() {
    var topic = TOPICS.filter(function (t) { return t.id === activeTab; })[0];
    if (!topic) return;
    if (!confirm('"' + topic.title + '" 주제를 삭제하시겠습니까?')) return;
    sb.from('실습주제').delete().eq('id', topic.id).then(function (r) {
      if (r.error) {
        if (r.error.code === '23503') {
          showToast('이 주제 안에 항목이 남아있어 삭제할 수 없어요. 먼저 안의 항목들을 삭제해주세요.');
        } else {
          showToast('삭제 실패: ' + r.error.message);
        }
        return;
      }
      showToast('주제가 삭제되었습니다.');
      activeTab = '';
      activeSubTab = '';
      load();
    });
  }

  function renderTabs() {
    var bar = document.getElementById('tabBar');
    bar.innerHTML = TOPICS.map(function (t, i) {
      var html = '<button class="tab-btn' + (t.id === activeTab ? ' active' : '') + '" data-cat="' + t.id + '">' + escapeHtml(t.title) + '</button>';
      if (IS_ADMIN && t.id === activeTab) {
        html += '<button class="btn small secondary move-topic-btn" data-dir="left" title="왼쪽으로 이동"' + (i === 0 ? ' disabled' : '') + '>◀</button>' +
          '<button class="btn small secondary move-topic-btn" data-dir="right" title="오른쪽으로 이동"' + (i === TOPICS.length - 1 ? ' disabled' : '') + '>▶</button>' +
          '<button class="btn small secondary danger" id="delTopicBtn" title="이 주제 삭제">🗑</button>';
      }
      return html;
    }).join('') +
      (IS_ADMIN ? '<button class="tab-btn" id="newTopicBtn" style="border-style:dashed;">+ 주제 만들기</button>' : '');
    bar.querySelectorAll('.tab-btn[data-cat]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        activeTab = Number(btn.getAttribute('data-cat'));
        activeSubTab = '';
        editingId = null;
        renderTabs();
        renderAddForm();
        renderItems();
      });
    });
    var newTopicBtn = document.getElementById('newTopicBtn');
    if (newTopicBtn) newTopicBtn.addEventListener('click', promptNewTopic);
    bar.querySelectorAll('.move-topic-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { moveTopic(btn.getAttribute('data-dir')); });
    });
    var delTopicBtn = document.getElementById('delTopicBtn');
    if (delTopicBtn) delTopicBtn.addEventListener('click', deleteActiveTopic);
  }

  function shareGalleryHtml(rows) {
    if (!rows.length) return '<div class="empty-state">아직 공유된 실습이 없습니다. 첫 실습을 공유해보세요!</div>';
    return '<div class="masonry">' + rows.map(function (s) {
      var imgHtml = s.image_url ? '<img src="' + escapeHtml(s.image_url) + '" alt="" loading="lazy">' : '';
      return '<div class="masonry-item">' + imgHtml +
        '<div style="padding:14px;">' +
        '<div class="title">' + escapeHtml(s.name || '익명') + '</div>' +
        '<div class="date">' + escapeHtml(s.created_at ? s.created_at.slice(0, 10) : '') + '</div>' +
        '<p style="margin:8px 0 0;white-space:pre-wrap;">' + escapeHtml(s.content) + '</p>' +
        (s.link ? '<div style="margin-top:8px;"><a href="' + escapeHtml(s.link) + '" target="_blank" rel="noopener">🔗 결과물 보기</a></div>' : '') +
        (IS_ADMIN ? '<div style="margin-top:8px;"><button class="btn small danger share-del-btn" data-id="' + s.id + '">삭제</button></div>' : '') +
        '</div></div>';
    }).join('') + '</div>';
  }

  function uploadSharePhoto(file) {
    var ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    var path = Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;
    return sb.storage.from('practice-share').upload(path, file).then(function (res) {
      if (res.error) throw res.error;
      return sb.storage.from('practice-share').getPublicUrl(path).data.publicUrl;
    });
  }

  function renderShareTab() {
    var wrap = document.getElementById('itemList');
    var formHtml = '<div class="card" style="margin-bottom:20px;">' +
      '<label>이름 (선택)</label><input type="text" id="shareName">' +
      '<label>공유 내용 *</label><textarea id="shareContent" placeholder="오늘 실습하면서 만든 결과물을 자유롭게 공유해보세요"></textarea>' +
      '<label>사진 (선택)</label><input type="file" id="sharePhoto" accept="image/*">' +
      '<div id="sharePreviewWrap" style="margin-top:8px;"></div>' +
      '<label>링크 (선택)</label><input type="text" id="shareLink" placeholder="결과물 링크가 있다면 남겨주세요">' +
      '<div style="margin-top:14px;"><button class="btn accent" id="shareSubmitBtn">공유하기</button></div>' +
      '</div>';

    wrap.innerHTML = formHtml + (SHARE_ROWS === null
      ? '<div class="loading-row"><span class="spinner"></span> 불러오는 중...</div>'
      : shareGalleryHtml(SHARE_ROWS));

    var photoInput = document.getElementById('sharePhoto');
    photoInput.addEventListener('change', function () {
      var previewWrap = document.getElementById('sharePreviewWrap');
      var file = photoInput.files[0];
      previewWrap.innerHTML = file ? '<img src="' + URL.createObjectURL(file) + '" style="max-width:160px;border-radius:10px;display:block;">' : '';
    });

    document.getElementById('shareSubmitBtn').addEventListener('click', function () {
      var content = document.getElementById('shareContent').value.trim();
      if (!content) { showToast('공유할 내용을 입력해주세요.'); return; }
      var file = photoInput.files[0];
      var btn = this;
      btn.disabled = true;
      btn.textContent = file ? '사진 올리는 중...' : '공유하는 중...';
      (file ? uploadSharePhoto(file) : Promise.resolve(''))
        .then(function (imageUrl) {
          return sb.from('실습공유').insert({
            name: document.getElementById('shareName').value.trim(),
            content: content,
            link: document.getElementById('shareLink').value.trim(),
            image_url: imageUrl
          });
        })
        .then(function (r) {
          btn.disabled = false;
          btn.textContent = '공유하기';
          if (r.error) { showToast('등록 실패: ' + r.error.message); return; }
          showToast('공유되었습니다!');
          SHARE_ROWS = null;
          loadShare();
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = '공유하기';
          showToast('사진 업로드 실패: ' + err.message);
        });
    });

    if (SHARE_ROWS === null) {
      loadShare();
    } else {
      wrap.querySelectorAll('.share-del-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('정말 삭제하시겠습니까?')) return;
          sb.from('실습공유').delete().eq('id', Number(btn.getAttribute('data-id'))).then(function (r) {
            if (r.error) { showToast('삭제 실패: ' + r.error.message); return; }
            showToast('삭제되었습니다.');
            SHARE_ROWS = null;
            loadShare();
          });
        });
      });
    }
  }

  function loadShare() {
    sb.from('실습공유').select('*').order('created_at', { ascending: false }).then(function (res) {
      if (res.error) {
        document.getElementById('itemList').innerHTML = '<div class="empty-state">불러오기 실패: ' + escapeHtml(res.error.message) + '</div>';
        return;
      }
      SHARE_ROWS = res.data || [];
      renderShareTab();
    });
  }

  function fieldsForm(prefix, item) {
    item = item || {};
    var selectedTopicId = item.topic_id != null ? item.topic_id : activeTab;
    var topicOptions = TOPICS.map(function (t) {
      return '<option value="' + t.id + '"' + (t.id === selectedTopicId ? ' selected' : '') + '>' + escapeHtml(t.title) + '</option>';
    }).join('');
    return '<label>실습 주제</label><select id="' + prefix + 'Topic">' + topicOptions + '</select>' +
      '<label>분류</label><input type="text" id="' + prefix + 'Cat" value="' + escapeHtml(item.category) + '" placeholder="예: 프롬프트 / Code.gs / index.html / 스프레드시트">' +
      '<label>제목</label><input type="text" id="' + prefix + 'Title" value="' + escapeHtml(item.title) + '">' +
      '<label>설명</label><textarea id="' + prefix + 'Desc">' + escapeHtml(item.description) + '</textarea>' +
      '<label>코드 (있는 경우)</label><textarea id="' + prefix + 'Code" style="min-height:120px;">' + escapeHtml(item.code) + '</textarea>' +
      '<label>링크 (있는 경우 - 스프레드시트 등)</label><input type="text" id="' + prefix + 'Link" value="' + escapeHtml(item.link) + '" placeholder="구글 시트 링크에서 /edit... 부분을 /copy 로 바꾸면, 클릭 시 자동으로 사본 만들기가 됩니다">';
  }

  function renderAddForm() {
    var wrap = document.getElementById('adminAddWrap');
    if (!IS_ADMIN) { wrap.innerHTML = ''; return; }
    if (!adding) {
      wrap.innerHTML = '<button class="btn accent" id="openAddBtn" style="margin-bottom:16px;">+ 실습자료 추가</button>';
      document.getElementById('openAddBtn').addEventListener('click', function () { adding = true; renderAddForm(); });
      return;
    }
    wrap.innerHTML = '<div class="card" style="margin-bottom:16px;">' + fieldsForm('new', {}) +
      '<div style="margin-top:14px;"><button class="btn" id="saveAddBtn">등록</button> <button class="btn secondary" id="cancelAddBtn">취소</button></div></div>';
    document.getElementById('cancelAddBtn').addEventListener('click', function () { adding = false; renderAddForm(); });
    document.getElementById('saveAddBtn').addEventListener('click', function () {
      var title = document.getElementById('newTitle').value.trim();
      var topicId = Number(document.getElementById('newTopic').value);
      var category = document.getElementById('newCat').value.trim();
      if (!title || !topicId || !category) { showToast('주제·분류·제목을 입력해주세요.'); return; }
      sb.from('실습자료').insert({
        topic_id: topicId,
        category: category,
        title: title,
        description: document.getElementById('newDesc').value.trim(),
        code: document.getElementById('newCode').value,
        link: document.getElementById('newLink').value.trim()
      }).then(function (r) {
        if (r.error) { showToast('등록 실패: ' + r.error.message); return; }
        showToast('등록되었습니다.');
        adding = false;
        activeTab = topicId;
        activeSubTab = category;
        load();
      });
    });
  }

  function renderItems() {
    var subBar = document.getElementById('subTabBar');
    var wrap = document.getElementById('itemList');
    var topicItems = ALL_ITEMS.filter(function (i) { return i.topic_id === activeTab; });
    if (!topicItems.length) {
      subBar.innerHTML = '';
      wrap.innerHTML = '<div class="empty-state">이 주제에 등록된 실습자료가 없습니다.</div>';
      return;
    }

    var seen = {};
    var subCats = [];
    topicItems.forEach(function (i) {
      var c = String(i.category);
      if (!seen[c]) { seen[c] = true; subCats.push(c); }
    });
    if (!activeSubTab || subCats.indexOf(activeSubTab) === -1) activeSubTab = subCats[0];

    subBar.innerHTML = subCats.map(function (c, i) {
      var html = '<button class="tab-btn' + (c === activeSubTab ? ' active' : '') + '" data-subcat="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>';
      if (IS_ADMIN && c === activeSubTab) {
        html += '<button class="btn small secondary move-subcat-btn" data-dir="left" title="왼쪽으로 이동"' + (i === 0 ? ' disabled' : '') + '>◀</button>' +
          '<button class="btn small secondary move-subcat-btn" data-dir="right" title="오른쪽으로 이동"' + (i === subCats.length - 1 ? ' disabled' : '') + '>▶</button>';
      }
      return html;
    }).join('');
    subBar.querySelectorAll('.tab-btn[data-subcat]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        activeSubTab = btn.getAttribute('data-subcat');
        editingId = null;
        renderItems();
      });
    });
    subBar.querySelectorAll('.move-subcat-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { moveSubcat(subCats, topicItems, btn.getAttribute('data-dir')); });
    });

    var items = topicItems.filter(function (i) { return String(i.category) === activeSubTab; });
    renderItemCards(items);
  }

  function moveSubcat(subCats, topicItems, direction) {
    var idx = subCats.indexOf(activeSubTab);
    var swapWith = direction === 'left' ? idx - 1 : idx + 1;
    if (idx < 0 || swapWith < 0 || swapWith >= subCats.length) return;
    var reorderedCats = subCats.slice();
    var tmp = reorderedCats[idx];
    reorderedCats[idx] = reorderedCats[swapWith];
    reorderedCats[swapWith] = tmp;
    var newOrder = [];
    reorderedCats.forEach(function (c) {
      topicItems.filter(function (i) { return String(i.category) === c; }).forEach(function (i) { newOrder.push(i); });
    });
    Promise.all(newOrder.map(function (item, i) {
      return sb.from('실습자료').update({ sort_order: i }).eq('id', item.id);
    })).then(function (results) {
      var failed = results.filter(function (r) { return r && r.error; })[0];
      if (failed) { showToast('순서 변경 실패: ' + failed.error.message); return; }
      load();
    });
  }

  function renderItemCards(items) {
    var wrap = document.getElementById('itemList');
    wrap.innerHTML = items.map(function (item, idx) {
      if (editingId === item.id) {
        return '<div class="card" style="margin-bottom:16px;">' + fieldsForm('edit' + item.id, item) +
          '<div style="margin-top:12px;"><button class="btn small save-edit-btn" data-id="' + item.id + '">저장</button> <button class="btn small secondary cancel-edit-btn">취소</button></div></div>';
      }
      var codeId = 'code_' + idx;
      var codeHtml = item.code
        ? '<div class="code-block">' +
          '<button class="copy-btn" data-target="' + codeId + '">복사</button>' +
          '<pre><code id="' + codeId + '">' + escapeHtml(item.code) + '</code></pre>' +
          '</div>'
        : '';
      var linkHtml = item.link
        ? '<div style="margin-top:10px;"><a class="btn secondary" href="' + escapeHtml(item.link) + '" target="_blank" rel="noopener">🔗 링크 열기 →</a></div>'
        : '';
      return '<div class="card" style="margin-bottom:16px;">' +
        '<span class="badge">' + escapeHtml(item.category) + '</span>' +
        '<div style="font-weight:800;font-size:16px;margin-top:8px;">' + escapeHtml(item.title) + '</div>' +
        '<p style="color:var(--text-mute);font-size:14px;margin:6px 0;">' + escapeHtml(item.description) + '</p>' +
        codeHtml + linkHtml +
        (IS_ADMIN ? '<div style="margin-top:10px;"><button class="btn small edit-btn" data-id="' + item.id + '">수정</button> <button class="btn small danger del-btn" data-id="' + item.id + '">삭제</button></div>' : '') +
        '</div>';
    }).join('');

    wrap.querySelectorAll('.copy-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var code = document.getElementById(btn.getAttribute('data-target')).textContent;
        copyText(code, btn);
      });
    });
    wrap.querySelectorAll('.edit-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { editingId = Number(btn.getAttribute('data-id')); renderItemCards(items); });
    });
    wrap.querySelectorAll('.cancel-edit-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { editingId = null; renderItemCards(items); });
    });
    wrap.querySelectorAll('.save-edit-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = Number(btn.getAttribute('data-id'));
        var p = 'edit' + id;
        sb.from('실습자료').update({
          topic_id: Number(document.getElementById(p + 'Topic').value),
          category: document.getElementById(p + 'Cat').value.trim(),
          title: document.getElementById(p + 'Title').value.trim(),
          description: document.getElementById(p + 'Desc').value.trim(),
          code: document.getElementById(p + 'Code').value,
          link: document.getElementById(p + 'Link').value.trim()
        }).eq('id', id).then(function (r) {
          if (r.error) { showToast('저장 실패: ' + r.error.message); return; }
          showToast('저장되었습니다.');
          editingId = null;
          load();
        });
      });
    });
    wrap.querySelectorAll('.del-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!confirm('정말 삭제하시겠습니까?')) return;
        sb.from('실습자료').delete().eq('id', Number(btn.getAttribute('data-id'))).then(function (r) {
          if (r.error) { showToast('삭제 실패: ' + r.error.message); return; }
          showToast('삭제되었습니다.');
          load();
        });
      });
    });
  }

  load();
</script>
</body>
</html>
