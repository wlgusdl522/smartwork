<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>질문하기 · 스마트워크 강의자료</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="questions">
<div class="app-shell">
  <div class="topbar">
    <div class="topbar-inner">
      <a href="index.html" style="text-decoration:none;">
        <div class="brand">
          🌱
          <span>
            <span id="navBrandTitle">스마트워크 강의자료</span>
            <small id="navBrandSub">교육 플랫폼</small>
          </span>
        </div>
      </a>
      <div class="nav-menu">
        <a href="index.html" data-page="home">홈</a>
        <a href="study.html" data-page="study">학습자료</a>
        <a href="practice.html" data-page="practice">실습자료</a>
        <a href="questions.html" data-page="questions">질문·답변</a>
        <a href="feedback.html" data-page="feedback">의견제안</a>
        <a href="notices.html" data-page="notices">공지사항</a>
        <a href="admin.html" data-page="admin" style="opacity:.55;font-size:12px;">관리자</a>
      </div>
    </div>
  </div>

  <div class="container">
    <h1 class="page-title">❓ 질문하기</h1>
    <p class="page-desc">궁금한 점을 남겨주세요. 질문과 답변은 모두에게 공개되어 반복 질문을 줄일 수 있습니다.</p>

    <div class="card">
      <label>질문 내용 *</label>
      <textarea id="qContent" placeholder="궁금한 내용을 입력해주세요"></textarea>

      <div class="checkbox-row">
        <input type="checkbox" id="qWantAnswer">
        <label style="margin:0;" for="qWantAnswer">개별 답변을 받고 싶습니다.</label>
      </div>

      <div class="form-extra" id="qExtra" style="display:none;">
        <label>소속</label>
        <input type="text" id="qOrg" placeholder="예: OO종합사회복지관">
        <label>이름</label>
        <input type="text" id="qName">
        <label>연락처</label>
        <input type="tel" id="qPhone" placeholder="010-0000-0000">
        <label>이메일</label>
        <input type="email" id="qEmail">
      </div>

      <div style="margin-top:18px;">
        <button class="btn accent" id="qSubmitBtn">질문 등록하기</button>
      </div>
    </div>

    <h2 style="margin-top:36px;font-size:18px;">💬 질문 · 답변 게시판</h2>
    <p class="page-desc" style="margin-bottom:12px;">제목을 클릭하면 질문과 답변이 펼쳐집니다.</p>
    <div class="card" id="boardWrap">
      <div class="loading-row"><span class="spinner"></span> 불러오는 중...</div>
    </div>
  </div>

  <footer class="site-footer">
    <div>스마트워크 강의자료 · 교육 종료 후에도 자유롭게 참고자료를 활용하세요.</div>
    <div id="footerContact" style="margin-top:4px;font-size:11px;opacity:.75;"></div>
  </footer>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script>
  document.getElementById('qWantAnswer').addEventListener('change', function () {
    document.getElementById('qExtra').style.display = this.checked ? 'block' : 'none';
  });

  var IS_ADMIN = false;
  var ROWS = [];
  var expandedId = null;
  var editingId = null;

  function titleOf(q) {
    var t = String(q.content || '');
    return t.length > 46 ? t.slice(0, 46) + '…' : t;
  }

  function getOwnToken(id) {
    return localStorage.getItem('qtoken_' + id);
  }
  function setOwnToken(id, token) {
    localStorage.setItem('qtoken_' + id, token);
  }
  function clearOwnToken(id) {
    localStorage.removeItem('qtoken_' + id);
  }

  function loadBoard() {
    getIsAdmin().then(function (isAdmin) {
      IS_ADMIN = isAdmin;
      return sb.from('질문').select('*, 답변(*)').order('created_at', { ascending: false });
    }).then(function (res) {
      var wrap = document.getElementById('boardWrap');
      if (res.error) {
        wrap.innerHTML = '<div class="empty-state">불러오기 실패: ' + escapeHtml(res.error.message) + '</div>';
        return;
      }
      ROWS = res.data || [];
      renderBoard();
    });
  }

  function renderBoard() {
    var wrap = document.getElementById('boardWrap');
    if (!ROWS.length) {
      wrap.innerHTML = '<div class="empty-state">아직 등록된 질문이 없습니다. 첫 질문을 남겨보세요!</div>';
      return;
    }
    wrap.innerHTML = ROWS.map(function (q) {
      var answer = Array.isArray(q['답변']) ? (q['답변'][0] || null) : (q['답변'] || null);
      var isOpen = expandedId === q.id;
      var answeredBadge = answer ? '' : ' <span class="badge">답변대기</span>';
      var ownToken = getOwnToken(q.id);
      var canManage = IS_ADMIN || !!ownToken;

      var body = '';
      if (isOpen) {
        var contact = (IS_ADMIN && q.wants_answer)
          ? '<div style="font-size:12px;color:var(--text-mute);margin:8px 0;">소속: ' + escapeHtml(q.affiliation) +
            ' · 이름: ' + escapeHtml(q.name) + ' · 연락처: ' + escapeHtml(q.contact) + ' · 이메일: ' + escapeHtml(q.email) + '</div>'
          : '';

        if (editingId === q.id) {
          body += '<textarea id="editQContent_' + q.id + '" style="margin-top:10px;">' + escapeHtml(q.content) + '</textarea>' +
            '<div style="margin-top:8px;"><button class="btn small save-q-btn" data-id="' + q.id + '">저장</button> <button class="btn small secondary cancel-q-btn" data-id="' + q.id + '">취소</button></div>';
        } else {
          body += '<p style="margin:10px 0 0;">' + escapeHtml(q.content) + '</p>' + contact;
          if (canManage) {
            body += '<div style="margin-top:8px;"><button class="btn small edit-q-btn" data-id="' + q.id + '">수정</button> <button class="btn small danger del-q-btn" data-id="' + q.id + '">삭제</button></div>';
          }
        }

        if (IS_ADMIN) {
          body += '<label>답변</label><textarea id="answerText_' + q.id + '">' + escapeHtml(answer ? answer.content : '') + '</textarea>' +
            '<div style="margin-top:8px;"><button class="btn small answer-save-btn" data-id="' + q.id + '">답변 저장</button></div>';
        } else {
          body += answer
            ? '<div class="answer-box"><div class="label">A. 답변 (' + escapeHtml(answer.created_at ? answer.created_at.slice(0, 10) : '') + ')</div>' + escapeHtml(answer.content) + '</div>'
            : '<div class="status-waiting">아직 답변이 등록되지 않았습니다.</div>';
        }
      }

      return '<div class="list-item">' +
        '<div class="title board-toggle" data-id="' + q.id + '" style="cursor:pointer;"><span class="chevron' + (isOpen ? ' open' : '') + '">▸</span> Q. ' + escapeHtml(titleOf(q)) + answeredBadge + '</div>' +
        '<div class="date">' + escapeHtml(q.created_at ? q.created_at.slice(0, 10) : '') + '</div>' +
        body +
        '</div>';
    }).join('');

    wrap.querySelectorAll('.board-toggle').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = Number(el.getAttribute('data-id'));
        expandedId = (expandedId === id) ? null : id;
        editingId = null;
        renderBoard();
      });
    });
    wrap.querySelectorAll('.edit-q-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        editingId = Number(btn.getAttribute('data-id'));
        renderBoard();
      });
    });
    wrap.querySelectorAll('.cancel-q-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { editingId = null; renderBoard(); });
    });
    wrap.querySelectorAll('.save-q-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = Number(btn.getAttribute('data-id'));
        var newContent = document.getElementById('editQContent_' + id).value.trim();
        if (!newContent) { showToast('내용을 입력해주세요.'); return; }
        var request = IS_ADMIN
          ? sb.from('질문').update({ content: newContent }).eq('id', id)
          : sb.rpc('update_own_question', { q_id: id, token: getOwnToken(id), new_content: newContent });
        request.then(function (r) {
          if (r.error) { showToast('저장 실패: ' + r.error.message); return; }
          showToast('저장되었습니다.');
          editingId = null;
          loadBoard();
        });
      });
    });
    wrap.querySelectorAll('.del-q-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!confirm('이 질문을 삭제하시겠습니까? 답변도 함께 삭제됩니다.')) return;
        var id = Number(btn.getAttribute('data-id'));
        var request = IS_ADMIN
          ? sb.from('질문').delete().eq('id', id)
          : sb.rpc('delete_own_question', { q_id: id, token: getOwnToken(id) });
        request.then(function (r) {
          if (r.error) { showToast('삭제 실패: ' + r.error.message); return; }
          showToast('삭제되었습니다.');
          clearOwnToken(id);
          expandedId = null;
          loadBoard();
        });
      });
    });
    wrap.querySelectorAll('.answer-save-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var qid = Number(btn.getAttribute('data-id'));
        var text = document.getElementById('answerText_' + qid).value;
        btn.disabled = true;
        sb.from('답변').upsert({ question_id: qid, content: text }, { onConflict: 'question_id' }).then(function (r) {
          btn.disabled = false;
          if (r.error) { showToast('저장 실패: ' + r.error.message); return; }
          showToast('답변이 저장되었습니다.');
          loadBoard();
        });
      });
    });
  }

  document.getElementById('qSubmitBtn').addEventListener('click', function () {
    var content = document.getElementById('qContent').value.trim();
    if (!content) { showToast('질문 내용을 입력해주세요.'); return; }
    var wantAnswer = document.getElementById('qWantAnswer').checked;
    var form = {
      content: content,
      wants_answer: wantAnswer,
      affiliation: wantAnswer ? document.getElementById('qOrg').value.trim() : '',
      name: wantAnswer ? document.getElementById('qName').value.trim() : '',
      contact: wantAnswer ? document.getElementById('qPhone').value.trim() : '',
      email: wantAnswer ? document.getElementById('qEmail').value.trim() : ''
    };
    var btn = this;
    btn.disabled = true;
    sb.from('질문').insert(form).select().then(function (res) {
      btn.disabled = false;
      if (res.error) {
        showToast('등록 실패: ' + res.error.message);
        return;
      }
      var inserted = res.data && res.data[0];
      if (inserted) setOwnToken(inserted.id, inserted.edit_token);
      showToast('질문이 등록되었습니다!');
      document.getElementById('qContent').value = '';
      document.getElementById('qWantAnswer').checked = false;
      document.getElementById('qExtra').style.display = 'none';
      ['qOrg', 'qName', 'qPhone', 'qEmail'].forEach(function (id) { document.getElementById(id).value = ''; });
      loadBoard();
    });
  });

  loadBoard();
</script>
</body>
</html>
